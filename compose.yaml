# Local PostgreSQL for development and the database tests. The credentials are
# for this local database only. Port 5433 avoids a server that may already
# listen on 5432.
services:
  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: fbo
      POSTGRES_PASSWORD: fbo
      POSTGRES_DB: fbo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Since image 18 the data directory lives below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbo -d fbo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
